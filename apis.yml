name: Ateios
description: Ateios Systems is an Indianapolis-based advanced battery manufacturer that produces high-energy,
  recyclable, PFA-free battery electrodes for global battery makers. Its proprietary RaiCure platform is a
  solvent-free, cure-on-command coating process using energy-curable polymers instead of solvent-based thermal
  drying, enabling thicker electrodes (>10 mAh/cm2), higher energy density, and roughly 5x faster coating
  throughput at lower cost and emissions. Ateios targets medical device, IoT, mobility, and defense markets.
  Founded in 2017 and backed by Techstars, TitletownTech, Good Growth Capital and others, the company is a
  materials/hardware manufacturer and publishes no developer API, SDK, or programmatic developer platform.
